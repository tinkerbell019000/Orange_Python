[pytest]
asyncio_mode = auto
addopts = -p no:playwright -v --html=reports/test_results.html --self-contained-html
testpaths = tests
python_files = test_*.py
pythonpath = .
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session


markers =
    smoke: Critical execution paths
    regression: Complete application scope verification