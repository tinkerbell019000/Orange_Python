[pytest]
asyncio_mode = auto
addopts = -p no:playwright -v --html=reports/test_results.html --self-contained-html
testpaths = tests/test_login.py
    tests/test_select_side_menu.py
    tests/test_test_add_user.py
    tests/test_sort_users.py
python_files = test_*.py
pythonpath = .
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session


markers =
    smoke: Critical execution paths
    regression: Complete application scope verification